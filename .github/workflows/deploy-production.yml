name: Deploy to Vercel Production

# Vercel Git Integration is intentionally disconnected from this project.
# Deploy the protected main branch through the Vercel CLI instead.
on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_CLI_VERSION: 54.18.0

concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MERMAID_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure APT retries and timeouts
        run: |
          sudo printf 'Acquire::Retries "3";\nAcquire::https::Timeout "30";\nAcquire::http::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/99-retries.conf

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install system fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-color-emoji fonts-liberation

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore OG image cache
        uses: actions/cache@v5
        with:
          path: tmp/og-image-cache
          key: ${{ runner.os }}-og-cache-${{ hashFiles('src/utils/og-templates/**', 'src/utils/generateOgImages.ts', 'src/utils/og-cache-validator.ts', 'src/utils/loadGoogleFont.ts', 'src/config.ts', 'package.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-og-cache-

      - name: Verify system Chrome
        run: |
          test -x "$MERMAID_CHROMIUM_EXECUTABLE_PATH"
          "$MERMAID_CHROMIUM_EXECUTABLE_PATH" --version

      - name: Pull Vercel Environment Information
        run: pnpm dlx "vercel@${VERCEL_CLI_VERSION}" pull --yes --environment=production --token="${VERCEL_TOKEN}"

      - name: Build Vercel Project
        # The protected main branch is expected to have passed PR CI.
        # vercel build consumes the environment and project settings pulled above.
        run: pnpm dlx "vercel@${VERCEL_CLI_VERSION}" build --prod --token="${VERCEL_TOKEN}"

      - name: Deploy Project Artifacts to Vercel
        run: pnpm dlx "vercel@${VERCEL_CLI_VERSION}" deploy --prebuilt --prod --token="${VERCEL_TOKEN}"
