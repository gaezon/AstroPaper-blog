name: Deploy to Vercel Production

# Vercel Git Integration is intentionally disconnected from this project.
# Deploy the protected main branch through the Vercel CLI instead.
on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  VERCEL_CLI_VERSION: 54.18.0

concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-production:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MERMAID_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Configure APT retries and timeouts
        run: |
          sudo printf 'Acquire::Retries "3";\nAcquire::https::Timeout "30";\nAcquire::http::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/99-retries.conf

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install system fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-color-emoji fonts-liberation

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore OG image cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/og-image-cache
          key: ${{ runner.os }}-og-cache-${{ hashFiles('src/utils/og-templates/**', 'src/utils/generateOgImages.ts', 'src/utils/og-cache-validator.ts', 'src/utils/loadGoogleFont.ts', 'src/config.ts', 'package.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-og-cache-

      - name: Verify system Chrome
        run: |
          test -x "$MERMAID_CHROMIUM_EXECUTABLE_PATH"
          "$MERMAID_CHROMIUM_EXECUTABLE_PATH" --version

      - name: Build Vercel Project
        # The protected main branch is expected to have passed PR CI.
        # Build locally so the project-scoped token only uploads artifacts.
        run: pnpm run build:strict

      - name: Verify Vercel token is configured
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: test -n "$VERCEL_TOKEN"

      - name: Deploy Project Artifacts to Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: pnpm dlx "vercel@${VERCEL_CLI_VERSION}" deploy --prebuilt --prod --token="${VERCEL_TOKEN}"
