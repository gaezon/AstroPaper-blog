name: Deploy to Vercel Production

on:
  push:
    branches:
      - main

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure APT retries and timeouts
        run: |
          sudo printf 'Acquire::Retries "3";\nAcquire::https::Timeout "30";\nAcquire::http::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/99-retries.conf

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install system fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-color-emoji fonts-liberation

      - name: Install dependencies
        run: pnpm install

      - name: Restore OG image cache
        uses: actions/cache@v4
        with:
          path: tmp/og-image-cache
          key: ${{ runner.os }}-og-cache-${{ hashFiles('src/data/blog/**/*.md', 'src/utils/og-templates/*.js', 'src/utils/og-templates/*.ts', 'src/utils/loadGoogleFont.ts', 'src/config.ts', 'package.json', 'pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Lint code
        run: pnpm run lint

      - name: Check code format
        run: pnpm run format:check

      - name: Build the project
        run: pnpm run build:strict

      - name: Pull Vercel Environment Information
        run: pnpm dlx vercel@latest pull --yes --environment=production --token=${VERCEL_TOKEN}

      - name: Deploy Project Artifacts to Vercel
        run: pnpm dlx vercel@latest deploy --prebuilt --prod --token=${VERCEL_TOKEN}
