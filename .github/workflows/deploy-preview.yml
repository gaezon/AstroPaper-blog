name: Deploy to Vercel Preview

on:
  push:
    branches:
      - "feature/*"
      - "fix/*"

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MERMAID_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure APT retries and timeouts
        run: |
          sudo printf 'Acquire::Retries "3";\nAcquire::https::Timeout "30";\nAcquire::http::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/99-retries.conf

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install system fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-color-emoji fonts-liberation

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore OG image cache
        uses: actions/cache@v4
        with:
          path: tmp/og-image-cache
          key: ${{ runner.os }}-og-cache-${{ hashFiles('src/data/blog/**/*.md', 'src/utils/og-templates/*.js', 'src/utils/og-templates/*.ts', 'src/utils/loadGoogleFont.ts', 'src/config.ts', 'package.json', 'pnpm-lock.yaml') }}

      - name: Verify system Chrome
        run: |
          test -x "$MERMAID_CHROMIUM_EXECUTABLE_PATH"
          "$MERMAID_CHROMIUM_EXECUTABLE_PATH" --version

      - name: Lint code
        run: pnpm run lint

      - name: Check code format
        run: pnpm run format:check

      - name: Build the project
        run: pnpm run build:strict

      - name: Pull Vercel Environment Information
        run: pnpm dlx vercel@latest pull --yes --environment=preview --token=${VERCEL_TOKEN}

      - name: Deploy Project Artifacts to Vercel
        id: vercel-deploy
        run: |
          DEPLOY_URL=$(pnpm dlx vercel@latest deploy --prebuilt --token=${VERCEL_TOKEN})
          echo "preview_url=$DEPLOY_URL" >> $GITHUB_OUTPUT

      - name: Comment Preview URL on PR
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.vercel-deploy.outputs.preview_url }}
        with:
          script: |
            const previewUrl = process.env.PREVIEW_URL;
            const { repo, owner } = context.repo;
            const branchName = context.ref.replace('refs/heads/', '');

            // Find the PR associated with this branch
            const { data: prs } = await github.rest.pulls.list({
              owner,
              repo,
              head: `${owner}:${branchName}`,
              state: 'open'
            });

            if (prs.length > 0) {
              const pr = prs[0];
              const body = `🚀 **Vercel Preview Deployed!**\n\nVisit your preview here: [${previewUrl}](${previewUrl})`;
              
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: pr.number,
                body: body
              });
              console.log(`Commented on PR #${pr.number}`);
            } else {
              console.log('No open PR found for this branch.');
            }
