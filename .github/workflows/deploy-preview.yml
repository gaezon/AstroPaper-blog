name: Deploy to Vercel Preview

# Vercel Git Integration is intentionally disconnected from this project.
# Deploy trusted same-repository pull requests through the Vercel CLI instead.
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

env:
  VERCEL_CLI_VERSION: 54.18.0

concurrency:
  group: deploy-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    # Fork PRs do not receive VERCEL_TOKEN. They remain covered by the regular
    # CI workflow, while same-repository PRs receive a real Vercel preview.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MERMAID_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Configure APT retries and timeouts
        run: |
          sudo printf 'Acquire::Retries "3";\nAcquire::https::Timeout "30";\nAcquire::http::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/99-retries.conf

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install system fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-color-emoji fonts-liberation

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore OG image cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: tmp/og-image-cache
          key: ${{ runner.os }}-og-cache-${{ hashFiles('src/utils/og-templates/**', 'src/utils/generateOgImages.ts', 'src/utils/og-cache-validator.ts', 'src/utils/loadGoogleFont.ts', 'src/config.ts', 'package.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-og-cache-

      - name: Verify system Chrome
        run: |
          test -x "$MERMAID_CHROMIUM_EXECUTABLE_PATH"
          "$MERMAID_CHROMIUM_EXECUTABLE_PATH" --version

      - name: Build Vercel Project
        # Build entirely in GitHub Actions so the project-scoped Vercel token
        # only needs to upload the resulting Build Output API artifacts.
        run: pnpm run build:strict

      - name: Verify Vercel token is configured
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: test -n "$VERCEL_TOKEN"

      - name: Deploy Project Artifacts to Vercel
        id: vercel-deploy
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          DEPLOY_URL=$(pnpm dlx "vercel@${VERCEL_CLI_VERSION}" deploy --prebuilt --token="${VERCEL_TOKEN}")
          test -n "$DEPLOY_URL"
          printf 'preview_url=%s\n' "$DEPLOY_URL" >> "$GITHUB_OUTPUT"

      - name: Comment Preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PREVIEW_URL: ${{ steps.vercel-deploy.outputs.preview_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const previewUrl = process.env.PREVIEW_URL;
            const { repo, owner } = context.repo;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: Number(process.env.PR_NUMBER),
              per_page: 100,
            });

            const body = `<!-- vercel-preview -->\n🚀 **Vercel Preview Deployed!**\n\nVisit your preview here: [${previewUrl}](${previewUrl})`;
            const existingComment = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes('<!-- vercel-preview -->')
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: Number(process.env.PR_NUMBER),
                body
              });
            }
