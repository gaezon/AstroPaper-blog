name: CI

permissions:
  contents: read

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
  workflow_call:

jobs:
  build:
    name: Code standards & build
    runs-on: ubuntu-latest
    timeout-minutes: 10 # Playwright 安装 + 构建 + 测试需要更多时间

    strategy:
      matrix:
        node-version: [24]

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@v6

      - name: "⚙️ Configure APT retries and timeouts"
        run: |
          sudo printf 'Acquire::Retries "3";\nAcquire::https::Timeout "30";\nAcquire::http::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/99-retries.conf

      - name: "📦 Install pnpm"
        uses: pnpm/action-setup@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: "📦 Install dependencies"
        run: pnpm install

      - name: "🗂️ Restore OG image cache"
        uses: actions/cache@v4
        with:
          path: tmp/og-image-cache
          key: ${{ runner.os }}-og-cache-${{ hashFiles('src/data/blog/**/*.md', 'src/utils/og-templates/*.js', 'src/utils/og-templates/*.ts', 'src/utils/loadGoogleFont.ts', 'src/config.ts', 'package.json', 'pnpm-lock.yaml') }}

      - name: "🎭 Install Playwright browsers"
        run: pnpm exec playwright install --with-deps chromium

      - name: "🔎 Lint code"
        run: pnpm run lint

      - name: "📝 Checking code format"
        run: pnpm run format:check

      - name: "🔐 Check Twikoo SRI"
        run: pnpm run twikoo:sri:check

      - name: "🚀 Build the project"
        run: pnpm run build:strict

      - name: "🎭 Run Playwright tests"
        run: pnpm exec playwright test --retries=2

      - name: "🗺️ Run sitemap tests"
        run: pnpm exec playwright test --config=playwright.sitemap.config.ts --retries=1
