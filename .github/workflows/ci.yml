name: CI

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_call:

jobs:
  build:
    name: Code standards & build
    runs-on: ubuntu-latest
    timeout-minutes: 25 # 构建和端到端测试需要更多时间
    env:
      MERMAID_CHROMIUM_EXECUTABLE_PATH: /usr/bin/google-chrome

    steps:
      - name: "☁️ Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "⚙️ Configure APT retries and timeouts"
        run: |
          sudo printf 'Acquire::Retries "3";\nAcquire::https::Timeout "30";\nAcquire::http::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/99-retries.conf

      - name: "📦 Install pnpm"
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Use Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: "📦 Install dependencies"
        run: pnpm install --frozen-lockfile

      - name: "🗂️ Restore OG image cache"
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: tmp/og-image-cache
          key: ${{ runner.os }}-og-cache-${{ hashFiles('src/utils/og-templates/**', 'src/utils/generateOgImages.ts', 'src/utils/og-cache-validator.ts', 'src/utils/loadGoogleFont.ts', 'src/config.ts', 'package.json', 'pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-og-cache-

      - name: "🎭 Verify system Chrome"
        run: |
          test -x "$MERMAID_CHROMIUM_EXECUTABLE_PATH"
          "$MERMAID_CHROMIUM_EXECUTABLE_PATH" --version

      - name: "🔎 Lint code"
        run: pnpm run lint

      - name: "📝 Checking code format"
        run: pnpm run format:check

      - name: "🧪 Run unit tests"
        run: pnpm run test:unit

      - name: "🔐 Check Twikoo SRI"
        run: pnpm run twikoo:sri:check

      - name: "🚀 Build the project"
        run: pnpm run build:strict

      - name: "🎭 Run Playwright tests"
        run: pnpm exec playwright test --retries=2

      - name: "🗺️ Run sitemap tests"
        run: pnpm exec playwright test --config=playwright.sitemap.config.ts --retries=1
